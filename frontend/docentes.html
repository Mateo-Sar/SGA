<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="JS/storage.js" defer></script>
    <script src="JS/ui.js" defer></script>
    <title>Docentes</title>
</head>
<body>
    <header>
    <h1>Sistema de Gestion Académica</h1>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="alumnos.html">Alumnos</a>
        <a href="docentes.html" class="activo">Docentes</a>
    </nav>
    </header>
    <main>
        <section class="formularioDocente">
            <h2>Alta de Docente</h2>
            <form id="formDocente">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre"><br><br>

                <label for="especialidad">Especialidad</label>
                <input type="text" id="especialidad"><br><br>

                <label for="correo">Correo</label>
                <input type="email" id="correo"><br><br>

                <button type="submit">Guardar Docente</button>
            </form>
        </section>
        <section class="docentes">
            <p id="mensaje" class="oculto"></p>
            <h2>Docentes registrados</h2>
            <p id="cantidadAlumnos"></p>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Especialidad</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
